name: update changelog

on:
  schedule:
    # Daily at 03:23 UTC (off the :00 mark to avoid herd timing)
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate changelog
        run: python .github/scripts/update_changelog.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push if changed
        run: |
          if ! git diff --quiet README.md; then
            git config user.name "grave0x-bot"
            git config user.email "grave0x@users.noreply.github.com"
            git add README.md
            git commit -m "chore: update changelog"
            git push
          fi
